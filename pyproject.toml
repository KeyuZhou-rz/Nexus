[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-dashboard"
version = "0.3.0b1"
description = "Local-first learning context layer for academic tasks and memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.31",
  "pandas>=1.5",
  "requests>=2.31",
  "feedparser>=6.0",
  "icalendar>=5.0",
  "chromadb>=1.0",
]

[project.optional-dependencies]
google = [
  "google-api-python-client>=2.100",
  "google-auth-httplib2>=0.1",
  "google-auth-oauthlib>=1.0",
]
archive = [
  "playwright>=1.40",
]
pdf = [
  "pypdf>=4.0.0",
  "pymupdf4llm>=0.0.17",
]
llm = [
  "litellm>=1.40.0",
]
# Convenience: install everything
all = [
  "nexus-dashboard[google,archive,pdf,llm]",
]

[project.scripts]
nexus = "nexus.cli.main:main"
nexus-doctor = "nexus.cli.doctor:main"
nexus-pipeline = "nexus.cli.pipeline:main"
nexus-briefing = "nexus.cli.briefing:main"
nexus-ingest = "nexus.cli.ingest:main"
nexus-query = "nexus.cli.query:main"
nexus-db-check = "nexus.cli.db_check:main"
nexus-db-backup = "nexus.cli.db_backup:main"
nexus-db-restore = "nexus.cli.db_restore:main"
nexus-db-repair = "nexus.cli.db_repair:main"
nexus-ui = "nexus.cli.ui:main"
nexus-dashboard = "nexus.cli.dashboard:main"
nexus-init = "nexus.cli.init:main"
nexus-sync-status = "nexus.cli.sync_status:main"
nexus-sync = "nexus.cli.sync:main"
nexus-demo = "nexus.cli.demo:main"
nexus-google-auth = "nexus.google_auth:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nexus.knowledge" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
