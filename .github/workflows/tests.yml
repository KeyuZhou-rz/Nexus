name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
      - name: Verify install
        run: pip check
      - name: Test
        run: python -m pytest tests -q
      - name: CLI smoke (core)
        run: |
          nexus --help
          nexus doctor --help
          nexus db-check --help
          nexus db-backup --help
      - name: CLI smoke (no import crash)
        run: |
          python -c "from nexus.cli.doctor import main; print('doctor ok')"
          python -c "from nexus.cli.db_check import main; print('db-check ok')"
          python -c "from nexus.cli.pipeline import main; print('pipeline ok')"

  test-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify core install
        run: pip check
      - name: Core CLI smoke (no optional deps)
        run: |
          nexus --help
          nexus doctor --help
          nexus db-check --help
          python -c "from nexus.cli.doctor import main; print('doctor ok')"
